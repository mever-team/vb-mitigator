[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vb-mitigator"
version = "0.1.0"
description = "A framework for implementing, running, and evaluating visual bias mitigation methods."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Ioannis Sarridis", email = "gsarridis@iti.gr" }]
keywords = ["bias mitigation", "fairness", "computer vision", "deep learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies (kept loosely pinned to lower bounds for maintainability).
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "Pillow>=10.0",
    "tqdm>=4.65",
    "yacs>=0.1.8",
    "PyYAML>=6.0",
    "tensorboard>=2.13",
    "gdown>=5.0",
]

[project.optional-dependencies]
# Tag-based methods (MAVias / MAVias-B / erm_tags) need heavier, optional deps.
mavias = [
    "transformers>=4.40",
    "ollama>=0.3",
    "timm>=1.0",
    "recognize-anything",
]
ui = ["streamlit>=1.30"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]
docs = ["sphinx>=7.0", "sphinx-rtd-theme>=1.3"]

[project.urls]
Homepage = "https://github.com/gsarridis/vb-mitigator"
Documentation = "https://vb-mitigator.readthedocs.io/"

[project.scripts]
vbm-train = "vbmitigator.cli:train_main"
vbm-eval = "vbmitigator.cli:eval_main"
vbm-list = "vbmitigator.cli:list_main"
vbm-ui = "vbmitigator.ui.launch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vbmitigator.ui" = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Put the src-layout package on sys.path so the suite runs without requiring an
# editable install (only the dependencies need to be present in the env).
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Faithfully ported research implementations (methods / datasets / models) are
# linted for import hygiene only; their original code style/semantics are kept
# as published. New first-party code (config, core, cli, ui) is linted strictly.
"src/vbmitigator/mitigators/*" = ["E402", "E711", "E712", "E722", "F841"]
"src/vbmitigator/datasets/*" = ["E711", "F841"]
"src/vbmitigator/models/*" = ["F822", "F841"]
