name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (CPU torch + package + dev/ui extras)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,ui]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Smoke — registries resolve (vbm-list)
        run: |
          vbm-list
          python - <<'PY'
          from vbmitigator.cli import registered_components
          c = registered_components()
          assert c["datasets"] and c["methods"] and c["models"] and c["metrics"], c
          print("registries OK:", {k: len(v) for k, v in c.items()})
          PY

      - name: Validate configs
        run: |
          python - <<'PY'
          import glob
          from vbmitigator.config import CFG
          from vbmitigator.mitigators import AVAILABLE_METHODS
          bad = []
          for path in glob.glob("configs/*/*/*.yaml"):
              cfg = CFG.clone()
              cfg.merge_from_file(path)
              if cfg.MITIGATOR.TYPE not in AVAILABLE_METHODS:
                  bad.append(path)
          assert not bad, f"invalid configs: {bad}"
          print("all configs valid")
          PY

      - name: Run tests
        run: pytest --cov=vbmitigator --cov-report=term-missing
